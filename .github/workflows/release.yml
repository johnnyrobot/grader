name: Release Source Verification

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: uv sync --extra dev --locked

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          uv run python scripts/release_version_guard.py
          --tag "${GITHUB_REF_NAME}"
          --out artifacts/release-evidence/release-version.json

      - name: Run Python tests
        run: uv run pytest engine/tests/ -q

      - name: Install frontend dependencies
        working-directory: app
        run: npm install

      - name: Run frontend component tests
        working-directory: app
        run: npm test -- --run

      # app/src-tauri/resources/ is gitignored: scripts/build_engine_bundle.py assembles a
      # relocatable CPython and the runtime dependencies there. Unlike gates.yml, which only
      # runs cargo check and can make do with empty directories, this job builds a real app
      # bundle and runs engine:check against it, so the bundle has to actually exist. That
      # also makes this workflow the thing that would catch issue #23 coming back.
      - name: Build the engine bundle
        run: uv run python scripts/build_engine_bundle.py

      - name: Check Rust desktop shell
        working-directory: app/src-tauri
        run: cargo check

      - name: Build unsigned Tauri app bundle
        working-directory: app
        run: npx tauri build --bundles app --no-sign --ci

      - name: Explain release boundary
        run: >-
          echo "Apple signing/notarization and public asset publication run locally through
          scripts/sign_and_notarize.sh and scripts/publish_local_release.py."
